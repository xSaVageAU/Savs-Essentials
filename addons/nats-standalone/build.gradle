base {
    archivesName = "savs-essentials-nats-standalone"
}

loom {
    mods {
        "savs-essentials-nats-standalone" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Core API is required to implement the provider
    compileOnly project(":core")
    
    // NATS-Fabric provides the connection lifecycle and jnats
    compileOnly("savage.natsfabric:nats-fabric:1.0.2")
    compileOnly("io.nats:jnats:2.25.2")
    
    // Zstd compression
    include(implementation("com.github.luben:zstd-jni:1.5.7-1"))
    
    // Jackson CBOR for efficient serialization (must explicitly include transitive dependencies in Fabric)
    include(implementation("com.fasterxml.jackson.core:jackson-core:2.18.2"))
    include(implementation("com.fasterxml.jackson.core:jackson-annotations:2.18.2"))
    include(implementation("com.fasterxml.jackson.core:jackson-databind:2.18.2"))
    include(implementation("com.fasterxml.jackson.dataformat:jackson-dataformat-cbor:2.18.2"))
}
